<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/head :: head('パスワード再設定用メール送信完了画面')}">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{common/navbar :: navbar}"></div>
    <div class="container flex-grow-1">
      <h1 class="fs-1 fw-bold text-center mb-3 mb-md-5">パスワード再設定用メール送信完了画面</h1>
      <p class="fs-6 fs-md-5 text-center">
        パスワード再設定用メールの送信が完了しました。メールをご確認ください。<br>
        再設定用URLの有効期限は30分となっています。<br>
        URLが無効になっている場合はお手数ですが再度申請をお願いします。
      </p>
      <div class="text-center mt-3 mt-md-5">
        <a class="btn btn-info btn-responsive" th:href="@{/password-reset/request}">再度申請</a>
      </div>
    </div>
    <div th:replace="~{common/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
