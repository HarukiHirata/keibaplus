<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{common/head :: head('パスワード再設定画面')}">
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div th:replace="~{common/navbar :: navbar}"></div>
    <div class="container text-center flex-grow-1">
      <h1 class="fs-2 fs-md-1 fw-bold m-2 m-md-4">パスワード再設定画面</h1>
      <form th:action="@{/password-reset}" th:object="${form}" method="post">
        <div class="alert alert-danger text-start fs-6 fs-md-5" role="alert" th:if="${#fields.hasErrors()}">
          <ul class="mb-0">
            <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
          </ul>
        </div>
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" th:field="*{token}" />
        <div class="row g-3 align-items-center my-1 my-md-3">
          <div class="col-12 col-md-4 text-start">
            <label class="form-label">パスワード（半角英数字記号・8～64文字）</label>
          </div>
          <div class="col-12 col-md-8">
            <input type="password" class="form-control" th:field="*{password}" minlength="8" maxlength="64" />
          </div>
          <div class="col-12 col-md-4 text-start">
            <label class="form-label">確認用パスワード（パスワードをもう一度入力）</label>
          </div>
          <div class="col-12 col-md-8">
            <input type="password" class="form-control" th:field="*{passwordConfirm}" minlength="8" maxlength="64" />
          </div>
        </div>
        <div class="text-center my-3 my-md-5">
          <button class="btn btn-warning btn-responsive" type="submit">パスワード変更</button>
        </div>
      </form>
    </div>
    <div th:replace="~{common/footer :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
